{{ define "content" }}
<div class="page-head"><h1>Account</h1><a class="button ghost" href="/admin">Back</a></div>

{{ if .Notice }}<p class="notice" role="status">{{ .Notice }}</p>{{ end }}
{{ if .Error }}<p class="error" role="alert">{{ .Error }}</p>{{ end }}

<section class="panel narrow">
  <h2>Change password</h2>
  <p class="hint">Signed in as {{ with .User }}{{ .Email }}{{ end }}. Minimum 10 characters.</p>
  <form method="post" action="/admin/account/password">
    <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
    <div class="field">
      <label for="current_password">Current password</label>
      <input id="current_password" name="current_password" type="password" autocomplete="current-password" required>
    </div>
    <div class="field">
      <label for="new_password">New password</label>
      <input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="10" required>
    </div>
    <div class="field">
      <label for="confirm_password">Confirm new password</label>
      <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="10" required>
    </div>
    <button type="submit">Update password</button>
  </form>
</section>
{{ end }}
