{{ define "profile_fields" }}
{{ $p := .Profile }}
<div class="field">
  <label for="name">Name</label>
  <input id="name" name="name" required value="{{ $p.Name }}">
</div>
<div class="field">
  <label for="slug">Slug</label>
  <input id="slug" name="slug" value="{{ $p.Slug }}" pattern="[a-z0-9-]+">
  <p class="hint">The public URL is {{ .BaseURL }}/<strong>slug</strong>. Changing it invalidates printed QR codes.</p>
</div>
<div class="field">
  <label for="subtitle">Subtitle</label>
  <input id="subtitle" name="subtitle" value="{{ $p.Subtitle }}">
</div>
<div class="field">
  <label for="description">Description</label>
  <textarea id="description" name="description" rows="3">{{ $p.Description }}</textarea>
</div>
<div class="field">
  <label for="phone">Phone</label>
  <input id="phone" name="phone" value="{{ $p.Phone }}" placeholder="+995 5xx xx xx xx">
</div>
<div class="field">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" value="{{ $p.Email }}">
</div>
<div class="field">
  <label for="website">Website</label>
  <input id="website" name="website" value="{{ $p.Website }}" placeholder="https://example.com">
</div>
<div class="field">
  <label for="address">Address</label>
  <input id="address" name="address" value="{{ $p.Address }}">
</div>
{{ end }}
